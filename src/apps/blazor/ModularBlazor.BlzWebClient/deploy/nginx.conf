# Blazor WebAssembly client: static files plus the SPA fallback to index.html.
server {
    listen 8080;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/wasm application/octet-stream application/json application/javascript text/css;

    # Written at container start and read on every load: never cache.
    location = /appsettings.json { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
