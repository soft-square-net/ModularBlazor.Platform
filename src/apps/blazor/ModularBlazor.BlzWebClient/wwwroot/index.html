<!DOCTYPE html>
<!-- Arabic is the default language: the page starts right to left; the script below switches to the user's saved
     choice before anything renders, and LocaleService (Services/LocaleService.cs) keeps it in step afterwards. -->
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modular Blazor</title>
    <base href="/" />
    <link rel="icon" href="data:," />
    <script>
        // appLocale: the saved language ("mb.culture") and <html lang dir>. Used by LocaleService through JS interop.
        (function () {
            var key = 'mb.culture';
            var rtl = /^(ar|he|fa|ur|ps|sd|ug|yi|dv|ckb)(-|$)/i;
            function get() { try { return localStorage.getItem(key); } catch (e) { return null; } }
            function apply(culture, dir, persist) {
                var root = document.documentElement;
                root.lang = culture;
                root.dir = dir || (rtl.test(culture) ? 'rtl' : 'ltr');
                if (persist) { try { localStorage.setItem(key, culture); } catch (e) { /* storage blocked */ } }
            }
            window.appLocale = { get: get, apply: apply };
            var saved = get();
            if (saved) apply(saved, null, false);
        })();
    </script>
    <script>
        // appBrand: the tenant's brand (Services/BrandingService.cs). The last one received is kept in localStorage
        // ("mb.brand") and applied here before anything renders: colours, radius, font, colour mode and favicon.
        // The user's own MudTail theme ("mud_vanilla_theme_config") keeps its colours when the brand allows them, and
        // its light/dark choice when the brand allows that mode.
        (function () {
            var key = 'mb.brand', mudKey = 'mud_vanilla_theme_config', modes = ['light', 'dark', 'system'];
            var mudDefaults = { primary: '#594ae2', secondary: '#ff4081', borderRadius: 4 };
            function read(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
            function hex(v) { return typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v); }
            function rgb(v) { var n = parseInt(v.slice(1), 16); return ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255); }
            function get() { return read(key); }
            function apply(brand, etag, caller) {
                if (!brand) return;
                var root = document.documentElement, style = root.style, user = read(mudKey) || {};
                var own = brand.allowUserColors !== false;
                function color(name, value, mine, fallback) {
                    var v = own && hex(mine) && mine.toLowerCase() !== fallback ? mine : value;
                    if (!hex(v)) return;
                    style.setProperty('--mud-palette-' + name, v);
                    style.setProperty('--mud-palette-' + name + '-rgb', rgb(v));
                }
                color('primary', brand.primary, user.primary, mudDefaults.primary);
                color('secondary', brand.secondary, user.secondary, mudDefaults.secondary);
                var radius = own && typeof user.borderRadius === 'number' && user.borderRadius !== mudDefaults.borderRadius ? user.borderRadius : brand.radius;
                if (typeof radius === 'number') {
                    style.setProperty('--mud-default-borderradius', radius + 'px');
                    style.setProperty('--mud-input-borderradius', radius + 'px');
                }
                if (brand.font) style.setProperty('--mb-brand-font', brand.font); else style.removeProperty('--mb-brand-font');

                var allowed = brand.allowedModes && brand.allowedModes.length ? brand.allowedModes : modes;
                // user.mode: the layout's theme drawer ('light' | 'dark' | 'system'); isDark alone: an older MudTail theme.
                var mode = modes.indexOf(user.mode) >= 0 ? user.mode : typeof user.isDark === 'boolean' ? (user.isDark ? 'dark' : 'light') : brand.defaultMode;
                if (allowed.indexOf(mode) < 0) mode = allowed.indexOf(brand.defaultMode) >= 0 ? brand.defaultMode : allowed[0];
                if (mode === 'system') mode = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                if (mode === 'dark') root.setAttribute('data-theme', 'dark'); else root.removeAttribute('data-theme');

                var icon = document.querySelector('link[rel="icon"]');
                if (icon) icon.href = brand.faviconUrl || 'data:,';

                if (etag) { try { localStorage.setItem(key, JSON.stringify({ eTag: etag, caller: caller || '', brand: brand })); } catch (e) { /* storage blocked */ } }
            }
            window.appBrand = { get: get, apply: apply };
            var saved = get();
            if (saved) apply(saved.brand, null, null);
        })();
    </script>
    <link rel="stylesheet" href="css/app.css" />
    <script src="moduleHost.js"></script>
    <script src="moduleCache.js"></script>
</head>
<body>
    <div id="app"><div class="boot" data-boot-text>جارٍ تحميل الوحدات الأساسية…</div></div>
    <script>
        if (!/^ar(-|$)/i.test(document.documentElement.lang)) {
            var boot = document.querySelector('[data-boot-text]');
            if (boot) boot.textContent = 'Loading core modules…';
        }
    </script>

    <div id="blazor-error-ui">
        <span data-error-text>حدث خطأ غير متوقع.</span>
        <a href="." class="reload" data-reload-text>إعادة التحميل</a>
        <span class="dismiss">✕</span>
    </div>
    <script>
        if (!/^ar(-|$)/i.test(document.documentElement.lang)) {
            document.querySelector('[data-error-text]').textContent = 'An unhandled error has occurred.';
            document.querySelector('[data-reload-text]').textContent = 'Reload';
        }
    </script>

    <!-- OpenID Connect (Authorization Code + PKCE) against the OpenIddict identity service. -->
    <script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
