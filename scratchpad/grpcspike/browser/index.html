<!doctype html>
<html><head><meta charset="utf-8"><title>gRPC-Web probe</title></head>
<body><pre id="out">running...</pre>
<script>
// Hand-made gRPC-Web calls (what Grpc.Net.Client.Web does in Blazor WASM): fetch, binary frames, cross-origin.
const base = "http://localhost:5398/api/grpcdemo/grpcdemo.Greeter/";
let token = null, tenant = null;
function frame(bytes) { const b = new Uint8Array(5 + bytes.length); new DataView(b.buffer).setUint32(1, bytes.length); b.set(bytes, 5); return b; }
function str(field, s) { const e = new TextEncoder().encode(s); return [(field << 3) | 2, e.length, ...e]; }
function parse(buf) {
  const out = []; let i = 0; const dv = new DataView(buf.buffer);
  while (i + 5 <= buf.length) { const flag = buf[i], len = dv.getUint32(i + 1); const body = buf.slice(i + 5, i + 5 + len);
    out.push(flag & 0x80 ? "trailers: " + new TextDecoder().decode(body).trim().replace(/\r\n/g, "; ") : "message " + len + " bytes"); i += 5 + len; }
  return out;
}
async function call(method, msg) {
  const headers = { "Content-Type": "application/grpc-web+proto", "X-Grpc-Web": "1" };
  if (token) headers.Authorization = "Bearer " + token;
  if (tenant) headers["X-Tenant"] = tenant;
  try {
    const r = await fetch(base + method, { method: "POST", headers, body: frame(new Uint8Array(msg)) });
    const body = new Uint8Array(await r.arrayBuffer());
    return `${method}: HTTP ${r.status}, readable grpc-status header=${r.headers.get("grpc-status")}, grpc-message=${r.headers.get("grpc-message")}, frames=[${parse(body).join(" | ")}]`;
  } catch (e) { return `${method}: fetch failed: ${e}`; }
}
window.runProbe = async (t, tn) => { token = t; tenant = tn;
  const lines = [];
  lines.push(await call("SayHello", str(1, "browser")));
  lines.push(await call("Countdown", [8, 3, 16, 100]));          // count=3, interval_ms=100
  lines.push(await call("WhoAmI", str(1, "enforce")));
  document.getElementById("out").textContent = lines.join("\n");
  return document.getElementById("out").textContent;
};
</script></body></html>
